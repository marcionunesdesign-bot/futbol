<style>:root{--z:1;--vh:calc(100dvh / var(--z));--vw:calc(100vw / var(--z))}
:root{--acc:#c8102e;--acc2:#ff4a5f;--accd:#7d0a1d;--accink:#fff;--c1:#c8102e;--c2:#111;
 --bg:#07090a;--panel:#121518;--panel2:#171b1f;--soft:#0d1013;--chip:#1e2328;--chip2:#272d33;--line:#ffffff14;--line2:#ffffff26;
 --ink:#f1efe9;--ink2:#a3a7a8;--ink3:#6f7579;--ok:#34d17b;--bad:#ff4d4f;--warn:#ffb340;
 --hd:"Barlow Condensed",Impact,sans-serif;--tx:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--pill:999px;
 --sh:0 0 0 1px #000,inset 0 0 30px color-mix(in srgb,var(--acc) 6%,transparent),0 10px 30px #000b}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% -12%,color-mix(in srgb,var(--acc) 38%,#000) 0,color-mix(in srgb,var(--acc) 10%,#090b0c) 36%,#07090a 68%,#040505 100%) fixed,#07090a;color:var(--ink);font:16px/1.45 var(--tx);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc2) 70%,transparent);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:calc(var(--vh) * 100 / 100);height:var(--vh)}
/* topo */
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(#141619f2,#0b0c0ef2);backdrop-filter:blur(18px);border-bottom:2px solid var(--acc);box-shadow:0 0 24px color-mix(in srgb,var(--acc) 30%,transparent);position:relative;z-index:20;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;font:800 25px/1 var(--hd);letter-spacing:.02em;white-space:nowrap}
.brand .n{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--btn);color:var(--accink);font-size:22px;box-shadow:0 0 16px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 1px #fff6}
.brand small{display:block;font:600 10px/1 var(--tx);letter-spacing:.24em;color:var(--acc2);margin-top:3px}
.nav{display:flex;gap:3px;background:#0a0b0d;border:1px solid var(--line);border-radius:var(--pill);padding:4px;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:none;color:var(--ink2);font:700 16px/1 var(--hd);letter-spacing:.04em;text-transform:uppercase;padding:0 12px;min-height:36px;border-radius:var(--pill);white-space:nowrap;position:relative}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--btn);color:var(--accink);box-shadow:0 0 14px color-mix(in srgb,var(--acc) 50%,transparent)}
.nav button i{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 6px var(--warn)}
.sp{flex:1}
.kpi{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.kpi b{font:700 21px/1 var(--hd);letter-spacing:.02em;white-space:nowrap}.kpi span{font-size:11px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:#15181b;display:grid;place-items:center;font-size:16px}
.iconbtn:hover{border-color:var(--acc)}.iconbtn.off{opacity:.45}
/* botões */
:root{--btn:linear-gradient(color-mix(in srgb,var(--acc2) 85%,#fff),var(--acc) 48%,var(--accd) 52%,var(--acc))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;font:700 17px/1 var(--hd);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;color:var(--accink);border:0;background:var(--btn);box-shadow:inset 0 1px #ffffff70,0 0 0 1px #000,0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.ghost{background:#16191c;color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent)}
.btn.ghost:hover{background:#1d2125}
.btn.sm{min-height:36px;padding:0 13px;font-size:15px}.btn.xs{min-height:30px;padding:0 10px;font-size:13.5px;border-radius:7px}
.btn.big{min-height:56px;font-size:22px;padding:0 28px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.go{animation:pulse 2.2s infinite}@keyframes pulse{50%{box-shadow:inset 0 1px #ffffff70,0 0 0 1px #000,0 0 26px color-mix(in srgb,var(--acc) 75%,transparent)}}
select,input[type=text],input[type=number]{background:#0e1012;border:1px solid var(--line2);border-radius:9px;min-height:40px;padding:0 11px;font-size:15px}
select:focus,input:focus{border-color:var(--acc);outline:0}
.seg{display:flex;background:#0b0d0f;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink2);font:700 14px/1 var(--hd);letter-spacing:.04em;text-transform:uppercase;min-height:32px;border-radius:7px;padding:0 6px;white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--accink)}
/* estrutura */
main{overflow:auto;padding:22px 24px 40px;scrollbar-color:#333 transparent}
.view{display:none;animation:fade .3s}.view.on{display:block}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.frame{background:linear-gradient(170deg,#15191c,#0f1214);border:1px solid color-mix(in srgb,var(--acc) 30%,#ffffff10);border-radius:14px;box-shadow:var(--sh);padding:18px}
.h{font:800 15px/1 var(--hd);letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.h small{color:var(--ink3);font:500 12px var(--tx);letter-spacing:.04em;text-transform:none;margin-left:auto}
h1.title{font:800 clamp(38px,calc(var(--vw) * 5 / 100),64px)/.92 var(--hd);text-transform:uppercase;margin:0;letter-spacing:.005em}
.eyebrow{font:700 12px/1 var(--tx);letter-spacing:.22em;text-transform:uppercase;color:var(--acc2)}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}.num{font-family:var(--hd);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}
.page-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:18px;flex-wrap:wrap}
/* tabelas */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:700 12px/1 var(--tx);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:default}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
td{padding:8px;border-bottom:1px solid var(--line);font-size:14.5px;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#ffffff08}
tr.me td{background:color-mix(in srgb,var(--acc) 16%,transparent)}tr.me td:first-child{box-shadow:inset 3px 0 var(--acc)}
.zone-up td:first-child{box-shadow:inset 3px 0 var(--ok)}.zone-dn td:first-child{box-shadow:inset 3px 0 var(--bad)}
.pos{display:inline-grid;place-items:center;min-width:38px;height:22px;border-radius:5px;font:700 13px/1 var(--hd);letter-spacing:.04em;padding:0 5px}
.pos.G{background:#f5c51830;color:#ffd84d}.pos.D{background:#3b82f630;color:#8fb8ff}.pos.M{background:#22c55e2b;color:#7ee2a5}.pos.A{background:#ef444430;color:#ff9a9a}
.ovr{display:inline-grid;place-items:center;width:38px;height:26px;border-radius:6px;font:800 18px/1 var(--hd);background:#ffffff10}
.ovr.hi{background:linear-gradient(#ffe07a,#d9a520);color:#2a1d00}.ovr.md{background:linear-gradient(#e8edf2,#9aa5b1);color:#14191e}.ovr.lo{background:linear-gradient(#d79a6a,#8f5a32);color:#1d0f04}
.bar{height:7px;border-radius:9px;background:#ffffff12;overflow:hidden;min-width:50px}.bar>i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.bar.w>i{background:var(--warn)}.bar.b>i{background:var(--bad)}.bar.a>i{background:var(--acc2)}
.stars{color:#ffd24d;letter-spacing:1px;font-size:13px}.stars s{color:#ffffff26;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pill);padding:3px 10px;font-size:12.5px;background:#ffffff0d;border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:#34d17b44}.chip.bad{color:var(--bad);border-color:#ff4d4f44}.chip.warn{color:var(--warn);border-color:#ffb34044}
.fm{display:inline-grid;place-items:center;width:30px;height:22px;border-radius:5px;font:700 13px/1 var(--hd)}
.fm.V{background:#1f9d55;color:#fff}.fm.E{background:#6b7280;color:#fff}.fm.D{background:#c53030;color:#fff}
.rt{display:inline-grid;place-items:center;min-width:34px;height:22px;border-radius:5px;font:700 14px/1 var(--hd);background:#ffffff12}
.rt.g{background:#1f9d5555;color:#9cf0bf}.rt.b{background:#c5303055;color:#ffb1b1}.rt.e{background:linear-gradient(#ffe07a,#d9a520);color:#2a1d00}
/* clube */
.crest{flex:none;display:block}
.banner{position:relative;overflow:hidden;border-radius:16px;min-height:190px;padding:26px 30px;display:flex;align-items:center;gap:26px;box-shadow:var(--sh);border:1px solid #ffffff1c}
.banner .pat{position:absolute;inset:0;z-index:0}
.banner .pat::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000d 0,#0008 45%,#0003 75%,#0000),radial-gradient(ellipse at 85% 50%,#fff2,transparent 60%)}
.banner>*:not(.pat){position:relative;z-index:1}
.banner h1{font:800 clamp(44px,calc(var(--vw) * 6 / 100),80px)/.9 var(--hd);text-transform:uppercase;margin:6px 0 8px;text-shadow:0 4px 18px #000}
/* cards */
.stat{display:flex;flex-direction:column;gap:4px}.stat b{font:800 34px/1 var(--hd)}.stat span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:8px;font:700 20px/1.05 var(--hd);text-transform:uppercase}
.vs .x{font:800 40px/1 var(--hd);color:var(--acc2)}
.msg{border-bottom:1px solid var(--line);padding:11px 4px;cursor:pointer}.msg:last-child{border:0}
.msg b{display:block;font-size:14.5px}.msg p{margin:3px 0 0;color:var(--ink2);font-size:13.5px}.msg.unread b::before{content:"● ";color:var(--acc2)}
/* tática */
.tac{display:grid;grid-template-columns:280px minmax(420px,1fr) 360px;gap:16px;align-items:start;height:calc(var(--vh) - 120px)}
.tac>.frame{height:100%;overflow:auto}
.board-wrap{display:flex;flex-direction:column;gap:10px;height:100%;padding:12px}
.board{position:relative;flex:1;min-height:0;display:flex;justify-content:center}
.board svg{height:100%;max-width:100%;user-select:none;touch-action:none;filter:drop-shadow(0 14px 26px #000c)}
.board canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:8px}
.shirt{cursor:grab}.shirt:active{cursor:grabbing}
.shirt.sel .sh-body{stroke:#fff36b;stroke-width:4}
.shirt .lbl{font:800 19px var(--hd);fill:#fff;paint-order:stroke;stroke:#000a;stroke-width:4px}
.shirt .fnb{font:800 13px var(--hd);letter-spacing:.05em}
.arrow{cursor:pointer}.arrow:hover line,.arrow.sel line{stroke:#fff36b}
.lineup .li{display:grid;grid-template-columns:26px 44px minmax(0,1fr) 54px 34px;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;border:1px solid transparent;cursor:grab;font-size:14.5px}
.lineup .li:hover{background:#ffffff08}.lineup .li.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.lineup .li.drop{border-color:#fff36b;background:#fff36b14}
.lineup .li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lineup .li .nm small{display:block;color:var(--ink3);font-weight:500;font-size:11.5px}
.lineup .n{font:800 18px/1 var(--hd);color:var(--ink3);text-align:center}
.ctl{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.ctl label{font:700 12px/1 var(--tx);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.fnopt{display:flex;flex-direction:column;gap:6px}.fnopt button{text-align:left;border:1px solid var(--line2);background:#101316;border-radius:9px;padding:9px 11px;font-size:14px}
.fnopt button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.fnopt button b{display:block;font:700 16px var(--hd);letter-spacing:.03em;text-transform:uppercase}
/* partida */
.matchv{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;height:calc(var(--vh) - 116px)}
.pitchbox{position:relative;border-radius:14px;overflow:hidden;background:#0b0d0c;box-shadow:var(--sh);min-height:0}
.pitchbox canvas{width:100%;height:100%;display:block}
.score{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px #000a;z-index:3;font-family:var(--hd)}
.score .tm{display:flex;align-items:center;gap:10px;padding:0 16px;font:800 22px/1 var(--hd);text-transform:uppercase;min-width:170px;background:#0d0f11e6;color:#fff;white-space:nowrap}
.score .tm.h{justify-content:flex-end}
.score .g{display:grid;place-items:center;font:800 44px/1 var(--hd);min-width:60px;padding:4px 10px;background:#f4f4f4;color:#111}
.score .clk{display:grid;place-items:center;font:800 24px/1 var(--hd);background:var(--acc);color:var(--accink);padding:0 14px;min-width:70px}
.ff{position:absolute;inset:0;display:grid;place-items:center;background:#000a;z-index:2;font:800 64px var(--hd);letter-spacing:.04em;color:#fff;pointer-events:none}
.ff small{display:block;font:600 16px var(--tx);color:var(--ink2);text-align:center;letter-spacing:.1em}
.goalfx{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
.goalfx b{font:900 clamp(80px,calc(var(--vw) * 14 / 100),190px)/1 var(--hd);color:#fff;text-shadow:0 0 40px var(--acc),0 8px 0 #000;animation:goal 2.6s cubic-bezier(.2,.8,.2,1) both;letter-spacing:.02em}
@keyframes goal{0%{transform:scale(.2) rotate(-8deg);opacity:0}15%{transform:scale(1.15) rotate(2deg);opacity:1}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.replay{position:absolute;top:16px;left:16px;z-index:3;background:#c8102e;color:#fff;font:800 14px var(--hd);letter-spacing:.12em;padding:5px 10px;border-radius:5px}
.mbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:center;z-index:3;flex-wrap:wrap}
.mbar .seg{background:#0b0d0fd9}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.side .frame{padding:14px}
.feed{overflow:auto;flex:1;min-height:0}
.ev{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.ev time{font:700 15px var(--hd);color:var(--ink3)}.ev.goal{color:#fff}.ev.goal p{font-weight:700}.ev.goal time{color:var(--acc2)}
.ev p{margin:0}
.sbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;font:700 16px var(--hd);margin:6px 0}
.sbar .lbl{grid-column:1/-1;text-align:center;font:600 11px var(--tx);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:-4px}
.sbar .tr{display:flex;height:7px;border-radius:9px;overflow:hidden;background:#ffffff10}.sbar .tr i{display:block;height:100%}
/* leilão */
.auct{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.lot{position:relative;overflow:hidden}
.lot .bignum{font:800 clamp(46px,calc(var(--vw) * 5 / 100),72px)/1 var(--hd)}
.env{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;background:#ffffff08;margin-bottom:6px;animation:fade .35s both}
.env.win{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 40%,transparent),transparent);box-shadow:inset 0 0 0 1px var(--acc)}
.env.you b{color:#fff36b}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots i{width:28px;height:6px;border-radius:9px;background:#ffffff1a}.dots i.done{background:var(--ink3)}.dots i.cur{background:var(--acc2)}
.attrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
.attr{display:grid;grid-template-columns:1fr 26px 70px;align-items:center;gap:8px;font-size:13.5px}
.attr b{font:700 16px var(--hd);text-align:right}
/* modal */
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s}
.modal>.frame{width:min(860px,100%);max-height:calc(var(--vh) * 92 / 100);overflow:auto;border:2px solid color-mix(in srgb,var(--acc) 60%,transparent);position:relative}
.modal .x{position:absolute;top:10px;right:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;transition:.3s;background:#16191c;border:1px solid var(--acc);border-radius:10px;padding:12px 18px;z-index:80;box-shadow:0 10px 30px #000c;max-width:calc(var(--vw) * 90 / 100)}
.toast.on{transform:translateX(-50%);opacity:1}
/* início */
.start{min-height:100%;display:grid;place-items:center;padding:30px}
.start .hero{text-align:center;margin-bottom:22px}
.start .hero h1{font:900 clamp(70px,calc(var(--vw) * 12 / 100),150px)/.85 var(--hd);margin:0;letter-spacing:.01em;background:linear-gradient(#fff,#bfc4c8 60%,#7d858b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 20px #000)}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:calc(var(--vh) * 46 / 100);overflow:auto;padding:4px}
.clubs button{border:1px solid var(--line2);background:#101316;border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font:700 16px/1.05 var(--hd);text-transform:uppercase;letter-spacing:.02em}
.clubs button:hover{border-color:#ffffff55}.clubs button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 0 22px color-mix(in srgb,var(--acc) 40%,transparent)}
.train{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.train button{text-align:left;border:1px solid var(--line2);background:#101316;border-radius:12px;padding:14px}
.train button b{display:block;font:800 21px/1 var(--hd);text-transform:uppercase;margin-bottom:6px}
.train button span{font-size:13px;color:var(--ink2)}.train button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,#101316);box-shadow:0 0 18px color-mix(in srgb,var(--acc) 30%,transparent)}
.youth{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ycard{display:flex;flex-direction:column;gap:10px}
.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:center}
.tie{background:#ffffff08;border-radius:8px;padding:6px 9px;margin:6px 0;font-size:13.5px}.tie div{display:flex;justify-content:space-between;gap:6px}.tie .w{font-weight:700;color:#fff}.tie .l{color:var(--ink3)}
@media (max-width:1250px){.tac{grid-template-columns:240px minmax(0,1fr);height:auto}.tac>.frame:last-child{grid-column:1/-1}.board{height:calc(var(--vh) * 70 / 100)}.matchv{grid-template-columns:1fr;height:auto}.pitchbox{height:calc(var(--vh) * 62 / 100)}}
@media (max-width:860px){.g2,.g3,.g4,.auct{grid-template-columns:1fr}.tac{grid-template-columns:1fr}main{padding:14px}.score .tm{min-width:0;font-size:16px}.score .g{font-size:32px}}

@media (max-width:1500px){.brand>div{display:none}.kpi span{display:none}}

.modal.wide>.frame{width:min(1500px,calc(var(--vw) * 98 / 100));max-height:calc(var(--vh) * 96 / 100);padding:14px}
.tac.inmatch{height:calc(calc(var(--vh) * 92 / 100) - 40px)}
.pnav{position:sticky;top:-18px;z-index:3;display:flex;align-items:center;justify-content:center;gap:14px;margin:-6px 40px 8px;padding:6px;background:linear-gradient(#15191cf0,#15191c00)}
.pnav .iconbtn{width:44px;height:44px;font-size:28px;line-height:1;background:var(--btn);color:var(--accink);border:0}
@keyframes slideR{from{opacity:.4;transform:translateX(30px)}}@keyframes slideL{from{opacity:.4;transform:translateX(-30px)}}
.lt{position:absolute;left:24px;bottom:78px;z-index:4;display:flex;align-items:stretch;gap:0;transform:translateX(-120%);transition:transform .45s cubic-bezier(.2,.9,.2,1);box-shadow:0 10px 30px #000b;pointer-events:none}
.lt.on{transform:none}.lt i{width:10px}.lt div{background:linear-gradient(90deg,#0e1113f2,#15191cf2);padding:10px 18px 10px 14px;display:flex;flex-direction:column}
.lt b{font:800 28px/1 var(--hd);text-transform:uppercase;letter-spacing:.02em;color:#fff}.lt span{font:600 13px var(--tx);color:var(--ink2);margin-top:4px}
.score{border:1px solid #ffffff22}
.pitchbox::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff14,inset 0 0 60px #0008;border-radius:14px}
.logo-h,.logo-s{color:#fff;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--acc) 45%,transparent))}
.crest-o{display:inline-grid;place-items:center;flex:none;vertical-align:middle}
.crest-o>img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 1px #fffa) drop-shadow(0 0 .5px #fff8) drop-shadow(0 2px 3px #0008)}
.crest-o>.cv{display:none}.crest-o.nf>img{display:none}.crest-o.nf>.cv{display:block}
/* ================= MOBILE ================= */
@media (max-width:760px){
  html,body{overflow-x:hidden}
  .app{grid-template-rows:auto minmax(0,1fr) auto}
  main{padding:12px 10px 86px!important;overflow-x:hidden}
  /* topo compacto */
  .top{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));flex-wrap:nowrap}
  .brand .logo-h{height:26px!important}
  .top .sp{flex:1}
  .top .kpi span,#b-music,#b-sfx,#b-cloud{display:none!important}
  .top .kpi b{font-size:16px}
  #top-crest .crest-o,#top-crest svg{width:26px!important;height:29px!important}
  .top .iconbtn{width:36px;height:36px;min-width:36px}
  #b-continue{padding:0 12px;min-height:38px;font-size:15px;white-space:nowrap}
  /* navegação inferior fixa */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:0;border:0;border-top:2px solid var(--acc);background:linear-gradient(#111417f5,#08090bf8);backdrop-filter:blur(14px);padding:4px 4px max(4px,env(safe-area-inset-bottom));gap:0;justify-content:space-between;box-shadow:0 -6px 24px #000a}

  /* grades viram coluna única */
  .grid,.g2,.g3,.g4,.auct,.youth,.train{grid-template-columns:minmax(0,1fr)!important}
  .row{flex-wrap:wrap}
  .frame{padding:12px;border-radius:12px}
  h1.title{font-size:34px!important}
  .page-head{flex-wrap:wrap;gap:8px}
  /* tabelas roláveis */
  .frame:has(>table),.frame:has(table){overflow-x:auto}
  table{font-size:13px}
  th,td{padding:7px 6px}
  /* banner do início */
  .banner{flex-direction:column;align-items:flex-start;padding:18px;gap:12px;min-height:0}
  .banner h1{font-size:40px!important;word-break:break-word}
  .banner .crest-o,.banner>svg.crest{width:64px!important;height:72px!important}
  .vs{gap:6px}.vs .t{font-size:15px}
  .vs .crest-o{width:60px!important;height:67px!important}
  .seg{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
  .seg button{white-space:nowrap;flex:1 0 auto}
  .vs .t{font-size:16px!important;gap:6px;min-width:0;word-break:break-word}
  .vs .x{font-size:40px!important}
  .vs .eyebrow{font-size:9px!important;letter-spacing:.1em}
  .banner:has(.vs){padding:14px 10px}
  td{white-space:nowrap}

const RVER=2;
function realGen(c,[n,pos,num]){const RL=(typeof C11_REAL!=='undefined')?C11_REAL:null;const st=RL&&RL.stars[n];const level=c.level||70;
  const age=st?st[1]:num>=40?rint(18,21):clamp(Math.round(26+gauss()*3.6),19,35);
  const tgt=st?st[0]:Math.min(77,level-1+(num>=1&&num<=11?1:num<=25?-2:num>=40?-7:-4)+gauss()*2.5);

// saves antigos: troca nomes fictícios pelos elencos reais (mantém ids, então escalação, leilão e histórico continuam válidos)
function syncRosters(){const RL=(typeof C11_REAL!=='undefined')?C11_REAL:null;if(!RL||!G||(G.rv||0)>=RVER)return 0;
  const realNames=new Set();for(const k in RL.clubs)for(const r of RL.clubs[k])realNames.add(r[0]);
  const lot=new Set(((G.auction&&G.auction.lots)||[]).map(l=>l.pid));let n=0;
  for(const name in G.clubs){const c=G.clubs[name];const list=RL.clubs[name];if(!list||!list.length)continue;
    const cur=c.players.map(id=>G.players[id]).filter(Boolean);const names=new Set(cur.map(p=>p.n));
    const avail=list.slice(0,32).filter(r=>!names.has(r[0]));if(!avail.length)continue;
    const fict=cur.filter(p=>!realNames.has(p.n));
    for(const p of fict){let i=avail.findIndex(r=>r[1]===p.p);if(i<0)i=avail.findIndex(r=>(GROUP[r[1]]||'')===(GROUP[p.p]||'?'));if(i<0)i=0;const r=avail.splice(i,1)[0];if(!r)break;
      const np=realGen(c,r);const keep={id:p.id,c:p.c,inj:p.inj,fi:p.fi,st:p.st,fm:p.fm,mo:p.mo,re:p.re};Object.assign(p,np,keep);if(!p.st)p.st=np.st;p.so=Math.round(ovrFor(p.t,p.p));p.v=valueOf(p);n++;if(!avail.length)break}

/* ---------- escalação ---------- */
function userClub(){return G.clubs[G.user]}
function bestLineup(club,slots){
  const avail=club.players.map(id=>G.players[id]).filter(p=>p&&!p.inj&&!p.y);
  const used=new Set(),line=[];
  const order=slots.map((s,i)=>i).sort((a,b)=>(slots[a].role==='GOL'?-1:0)-(slots[b].role==='GOL'?-1:0));
  for(const i of order){let best=null,bv=-1;for(const p of avail){if(used.has(p.id))continue;const v=ratingIn(p,slots[i].role)*(.75+.25*(p.fi/100));if(v>bv){bv=v;best=p}}
    line[i]=best?best.id:null;if(best)used.add(best.id)}
  const subs=avail.filter(p=>!used.has(p.id)).sort((a,b)=>ovr(b)-ovr(a)).slice(0,9).map(p=>p.id);
  return {line,subs};
}
function autoLineup(){const {line,subs}=bestLineup(userClub(),G.tactic.slots);G.tactic.lineup=line;G.tactic.subs=subs}
function validateLineup(){
  const c=userClub(),t=G.tactic;const ids=new Set(c.players);
  t.lineup=t.lineup.map(id=>id&&ids.has(id)&&G.players[id]&&!G.players[id].inj?id:null);
  if(t.lineup.some(x=>!x)){const {line}=bestLineup(c,t.slots);const used=new Set(t.lineup.filter(Boolean));
    t.lineup=t.lineup.map((id,i)=>{if(id)return id;const cand=c.players.map(x=>G.players[x]).filter(p=>!p.inj&&!p.y&&!used.has(p.id)).sort((a,b)=>ratingIn(b,t.slots[i].role)-ratingIn(a,t.slots[i].role))[0];if(cand){used.add(cand.id);return cand.id}return line[i]})}
  const inL=new Set(t.lineup);t.subs=(t.subs||[]).filter(id=>ids.has(id)&&!inL.has(id)&&G.players[id]&&!G.players[id].inj).slice(0,9);
  if(t.subs.length<9){for(const p of c.players.map(x=>G.players[x]).filter(p=>!p.y&&!p.inj&&!inL.has(p.id)&&!t.subs.includes(p.id)).sort((a,b)=>ovr(b)-ovr(a))){if(t.subs.length>=9)break;t.subs.push(p.id)}}
}
function setFormation(name){const t=G.tactic;const old=t.slots;t.formation=name;t.slots=buildSlots(name);
  const keep=t.lineup.slice();const {line}=bestLineup(userClub(),t.slots);
  // tenta manter os mesmos onze, reposicionando
  const pool=keep.filter(Boolean);const used=new Set();t.lineup=t.slots.map((s,i)=>{let b=null,bv=-1;for(const id of pool){if(used.has(id))continue;const v=ratingIn(G.players[id],s.role);if(v>bv){bv=v;b=id}}if(b){used.add(b);return b}return line[i]});
  G.fam=Math.round(G.fam*.65);}
function teamStrength(club){
  const slots=club.id===G.user?G.tactic.slots:buildSlots(club.formation);
  const line=club.id===G.user?G.tactic.lineup:bestLineup(club,slots).line;
  let s=0,n=0;line.forEach((id,i)=>{const p=G.players[id];if(p){s+=ratingIn(p,slots[i].role)*(.85+.15*p.fi/100)*(.94+(p.mo+p.re)/1700);n++}});
  return n?s/11:40;
}
function aiTeam(clubId){
  const c=G.clubs[clubId];const slots=buildSlots(c.formation);const {line,subs}=bestLineup(c,slots);
  const diff=teamStrength(c)-(G.clubs[G.user]?teamStrength(G.clubs[G.user]):70);

}
function bonusBoost(){const B=G.bonus||{};const wage=userClub().players.map(id=>G.players[id]).filter(Boolean).reduce((a,p)=>a+p.w,0)/22||5000;const x=((B.win||0)+(B.goal||0)*.6)/wage;return 1+Math.min(.045,x*.03)}
function userTeam(){validateLineup();const t=G.tactic;return {club:userClub(),slots:t.slots,line:t.lineup.slice(),subs:t.subs.slice(),tactic:t,fam:G.fam,boost:bonusBoost()*(G.trainPending?.97:1)*(G.talkBoost||1)}}

/* ---------- temporada ---------- */
function roundRobin(ids){
  const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,rounds=[];
  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)pr.push((r+i)%2?[y,x]:[x,y])}rounds.push(pr);a.splice(1,0,a.pop())}
  return rounds;
}
function expandLeagues(){
  if(G.div.A.length>=20&&G.cal)return;
  const have=new Set(Object.keys(G.clubs));
  for(const d of DIVS){const list=D.divisions[d];
    for(const n of list){if(have.has(n))continue;
      let i=DIVS.indexOf(d),tgt=null;for(let k=0;k<4&&!tgt;k++){for(const j of [i+k,i-k]){const dd=DIVS[j];if(dd&&G.div[dd].length<20){tgt=dd;break}}}
      if(!tgt)continue;const c=makeClub(n,tgt,G.div[tgt].length);G.clubs[n]=c;G.div[tgt].push(n);have.add(n)}}
  G.cal=CAL20;G.v=Math.max(G.v||3,4);
}
function startSeason(first){
  G.date=0;G.fixtures={};G.results={};G.table={};G.played={};
  expandLeagues();
  const NR=nRounds();
  for(const d of DIVS){let rr=roundRobin(shuffle(G.div[d].slice()));if(rr.length>NR){const bye=G.div[d].includes(G.user)?rr.findIndex(r=>!r.some(f=>f.includes(G.user))):rr.length-1;rr=rr.filter((r,i)=>i!==(bye<0?rr.length-1:bye)).slice(0,NR)}G.fixtures[d]=rr;G.results[d]=[];G.table[d]={};for(const c of G.div[d])G.table[d][c]={j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0,f:''}}
  // Taça Nacional: 16 clubes
  const pickTop=(d,n)=>G.div[d].slice().sort((a,b)=>teamStrength(G.clubs[b])-teamStrength(G.clubs[a])).slice(0,n);
  let cup=[];const qual={};const prev=G.prevTables||null;
  for(const d of DIVS){const src=(prev&&prev[d]?prev[d].filter(id=>G.clubs[id]):pickTop(d,20)).filter(id=>!cup.includes(id));
    src.slice(0,CUP_QN[d]).forEach((id,i)=>{cup.push(id);qual[id]=prev&&prev[d]?`${i+1}º da Série ${d} em ${G.season-1}`:`${i+1}º no ranking da Série ${d}`})}
  if(!cup.includes(G.user)){const o=cup.pop();delete qual[o];cup.push(G.user);qual[G.user]='Vaga de convidado'}
  cup=shuffle(cup);G.cup={alive:cup,ties:[],round:0,champion:null,out:{},qual};
  for(const p of Object.values(G.players)){p.st={j:0,g:0,as:0,inj:0,ns:0,nn:0};p.so=ovr(p);p.fm=p.fm.slice(-3)}
  const c=userClub();const rank=G.div[c.div].slice().sort((a,b)=>teamStrength(G.clubs[b])-teamStrength(G.clubs[a])).indexOf(G.user)+1;
  const goalPos=Math.max(1,Math.min(10,rank-(c.div==='D'?1:0)));
  G.board.goalPos=goalPos;G.board.goal=goalPos<=3?`terminar entre os 3 primeiros${c.div!=='A'?' e subir':''}`:goalPos<=6?`ficar entre os ${goalPos} primeiros`:`terminar acima da zona de rebaixamento`;
  G.board.cupGoal=rank<=4?'chegar à semifinal da Taça':'passar das oitavas da Taça';
  msg(`Temporada ${G.season}`,`A diretoria do ${c.name} definiu a meta: ${G.board.goal} na ${divName(c.div)} e ${G.board.cupGoal}. São ${nRounds()} rodadas de liga e 4 datas de Taça Nacional.`);
  msg('🏆 Taça Nacional '+G.season,`${G.cup.qual[G.user]==='Vaga de convidado'?'Seu clube entra na Taça com a vaga de convidado.':'Seu clube está classificado para a Taça ('+G.cup.qual[G.user]+').'} ${CUP_RULE}`);

const divName=d=>'Série '+d;
function dateInfo(i=G.date){
  const K=cal();if(i>=K.length)return null;
  const kind=K[i];
  if(kind==='L'){const r=K.slice(0,i+1).filter(x=>x==='L').length-1;return {kind,leagueRound:r,label:`Rodada ${r+1} de ${nRounds()}`}}
  const cr=K.slice(0,i+1).filter(x=>x==='C').length-1;return {kind,cupRound:cr,label:`Taça Nacional · ${CUP_NAMES[cr]}`};
}
function nextUserMatch(){
  const di=dateInfo();if(!di)return null;const u=G.user;
  if(di.kind==='L'){const fx=G.fixtures[userClub().div][di.leagueRound].find(([h,a])=>h===u||a===u);return fx?{type:'L',home:fx[0],away:fx[1],label:`${divName(userClub().div)} · ${di.label}`}:{type:'BYE',label:`${divName(userClub().div)} · ${di.label} · folga`}}
  ensureCupDraw();
  const tie=G.cup.ties.find(([h,a])=>h===u||a===u);
  if(tie)return {type:'C',home:tie[0],away:tie[1],label:di.label,knock:true};

  if(!G.cup.placement||G.cup.placement.date!==G.date){const pool=Object.keys(G.cup.out).filter(c=>c!==u);const opp=pick(pool.length?pool:G.div[userClub().div].filter(c=>c!==u));G.cup.placement={date:G.date,opp,home:R()<.5}}
  const pl=G.cup.placement;return {type:'P',home:pl.home?u:pl.opp,away:pl.home?pl.opp:u,label:'Taça Nacional · Jogo de colocação'};

function ensureCupDraw(){

  const a=shuffle(G.cup.alive.slice());G.cup.ties=[];for(let i=0;i<a.length;i+=2)G.cup.ties.push([a[i],a[i+1]]);

/* simulação rápida (outros jogos) */
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
function quickResult(h,a,neutral){
  const mom=id=>{const c=G.clubs[id];const t=G.table[c.div]&&G.table[c.div][id];const f=t&&t.f?t.f.slice(-3):'';return ([...f].reduce((x,y)=>x+(y==='V'?1:y==='D'?-1:0),0))*.5};
  const sh=teamStrength(G.clubs[h])*(1+gauss()*.035)+mom(h),sa=teamStrength(G.clubs[a])*(1+gauss()*.035)+mom(a);
  const lh=1.3*Math.exp((sh-sa)*.055)+(neutral?0:.22),la=1.08*Math.exp((sa-sh)*.055);
  return [poisson(lh),poisson(la)];
}
function pickScorers(clubId,goals){/* só escolhe quem marcou (sem contar ainda) */
  const c=G.clubs[clubId];const ps=c.players.map(i=>G.players[i]).filter(p=>p&&!p.inj&&!p.y);if(!ps.length)return [];
  const wG={ATA:6,PD:3.4,PE:3.4,MEI:2.6,MC:1.3,VOL:.6,LD:.4,LE:.4,ZAG:.5,GOL:0};
  const draw=()=>{let tot=0;const arr=ps.map(p=>{const x=(wG[p.p]||0)*Math.pow(p.t.fin/10,2)*(ovr(p)>c.level-4?1.6:.5);tot+=x;return x});let r=R()*tot;for(let i=0;i<ps.length;i++){r-=arr[i];if(r<=0)return ps[i]}return ps[0]};
  const out=[];for(let i=0;i<goals;i++)out.push(draw().id);return out}
/* um jogo dos outros clubes, com minuto de cada gol, expulsões e lesões */
function simOne(h,a,neutral){const [gh,ga]=quickResult(h,a,neutral);const sh=pickScorers(h,gh),sa=pickScorers(a,ga);const tl=[];
  const used=new Set();const minute=()=>{let m;do{m=rint(1,90)}while(used.has(m));used.add(m);return m};
  sh.forEach(pid=>tl.push({m:minute(),k:'g',s:0,pid}));sa.forEach(pid=>tl.push({m:minute(),k:'g',s:1,pid}));
  [[h,0],[a,1]].forEach(([id,s])=>{const ps=G.clubs[id].players.map(i=>G.players[i]).filter(p=>p&&!p.inj&&!p.y).sort((x,y)=>ovr(y)-ovr(x)).slice(0,11);if(!ps.length)return;
    if(R()<.08){const p=ps[rint(1,ps.length-1)]||ps[0];tl.push({m:rint(25,89),k:'r',s,pid:p.id})}
    if(R()<.07){const p=ps[rint(0,ps.length-1)];tl.push({m:rint(5,88),k:'i',s,pid:p.id,inj:rint(1,3)})}});
  tl.sort((x,y)=>x.m-y.m);const pens=neutral&&gh===ga?penalties(h,a):null;return {h,a,gh,ga,sh,sa,tl,pens}}
/* a rodada inteira é calculada uma vez por data: a tela da rodada mostra exatamente o que vai valer */
function roundPreview(){const di=dateInfo();if(!di)return null;const key=G.season+'-'+G.date;if(G.rp&&G.rp.key===key)return G.rp;const u=G.user;const rp={key,kind:di.kind,games:{}};
  if(di.kind==='L'){for(const d of DIVS)rp.games[d]=G.fixtures[d][di.leagueRound].filter(([h,a])=>h!==u&&a!==u).map(([h,a])=>simOne(h,a,false))}
  else{ensureCupDraw();rp.games.C=G.cup.ties.filter(([h,a])=>h!==u&&a!==u).map(([h,a])=>simOne(h,a,true))}
  G.rp=rp;return rp}
function rpGet(h,a){const rp=roundPreview();for(const k in rp.games){const g=rp.games[k].find(x=>x.h===h&&x.a===a);if(g)return g}return simOne(h,a,rp.kind!=='L')}
function rpApply(g){/* lesões dos outros jogos valem de verdade */for(const e of g.tl)if(e.k==='i'){const p=G.players[e.pid];if(p&&!p.inj&&p.c!==G.user){p.inj=e.inj;p.st.inj=(p.st.inj||0)+1}}}
function creditScorers(clubId,goals,ids){
  const c=G.clubs[clubId];const ps=c.players.map(i=>G.players[i]).filter(p=>p&&!p.inj&&!p.y);
  const wG={ATA:6,PD:3.4,PE:3.4,MEI:2.6,MC:1.3,VOL:.6,LD:.4,LE:.4,ZAG:.5,GOL:0};

function devDelta(p,factor){

function interestIn(club,p){

}

}

    if(up[d]){const nd=DIVS[i-1];G.div[d]=G.div[d].filter(x=>!up[d].includes(x));G.div[nd].push(...up[d]);up[d].forEach(x=>{G.clubs[x].div=nd;summary.moves.push([x,d,nd])})}
    if(down[d]){const nd=DIVS[i+1];G.div[d]=G.div[d].filter(x=>!down[d].includes(x));G.div[nd].push(...down[d]);down[d].forEach(x=>{G.clubs[x].div=nd;summary.moves.push([x,d,nd])})}}

  {const mv=summary.moves.find(m=>m[0]===u);if(mv&&DIVS.indexOf(mv[2])<DIVS.indexOf(mv[1]))celebrate('acesso',`Acesso à Série ${mv[2]}`,`${userClub().name} sobe de divisão em ${G.season}!`)}

  {const seen=new Set();const all=[...(G.xfer||[]),...(summary.market||[])].filter(x=>{const key=x.pid+'|'+x.from+'|'+x.to;if(seen.has(key))return false;seen.add(key);return true}).sort((a,b)=>b.price-a.price);summary.recap.xfers=all.slice(0,10);summary.recap.nx=all.length;G.xfer=[]}

  G.specialAuction=true;startSeason(false);
}

function hashS(t){let h=2166136261;for(const ch of String(t))h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0}
function coachOf(id){if(id===G.user)return G.manager||'Você';const c=G.clubs[id];if(!c)return '—';if(!c.coach){const h=hashS(id+'#coach');c.coach=D.first[h%D.first.length]+' '+D.last[(h>>>8)%D.last.length]}return c.coach}
function seasonRecap(champ,up,down){
  const ps=Object.values(G.players).filter(p=>p.c&&G.clubs[p.c]&&p.st);
  const rt=p=>p.st.nn?p.st.ns/p.st.nn:0;const maxJ=Math.max(1,...ps.map(p=>p.st.j||0));const minJ=Math.max(4,Math.round(maxJ*.45));
  const card=(p,x)=>p?Object.assign({id:p.id,n:p.n,p:p.p,a:p.a,c:p.c,o:ovr(p),j:p.st.j||0,g:p.st.g||0,as:p.st.as||0,r:+rt(p).toFixed(2)},x||{}):null;
  const dw=d=>({A:1.15,B:1,C:.9,D:.8})[G.clubs[d.c].div]||1;
  const reg=ps.filter(p=>(p.st.j||0)>=minJ&&p.st.nn);
  const score=p=>(rt(p)*dw(p)+(p.st.g||0)*.035+(p.st.as||0)*.025);
  const mvp=reg.slice().sort((a,b)=>score(b)-score(a))[0];
  const scorers=ps.slice().sort((a,b)=>(b.st.g||0)-(a.st.g||0)||(b.st.as||0)-(a.st.as||0)).slice(0,5).filter(p=>p.st.g>0).map(p=>card(p));
  const assist=ps.slice().sort((a,b)=>(b.st.as||0)-(a.st.as||0)||(b.st.g||0)-(a.st.g||0))[0];
  const gk=reg.filter(p=>p.p==='GOL').sort((a,b)=>rt(b)*dw(b)-rt(a)*dw(a))[0];
  const young=reg.filter(p=>p.a<=21).sort((a,b)=>score(b)-score(a))[0];
  const slots=['GOL','LD','ZAG','ZAG','LE','VOL','MC','MEI','PE','ATA','PD'];const used=new Set();
  const xi=slots.map(pos=>{const alt={MC:['MC','VOL','MEI'],MEI:['MEI','MC'],VOL:['VOL','MC'],PE:['PE','PD','ATA'],PD:['PD','PE','ATA'],ATA:['ATA']}[pos]||[pos];
    const p=reg.filter(q=>!used.has(q.id)&&alt.includes(q.p)).sort((a,b)=>score(b)-score(a))[0];if(p){used.add(p.id);return card(p,{slot:pos})}return null});
  const teams=[];for(const d of DIVS){const t=sortedTable(d);t.forEach((r,i)=>teams.push({id:r.id,d,pos:i+1,pts:r.pts,gp:r.gp,gc:r.gc,j:r.j,v:r.v}))}
  const att=teams.slice().sort((a,b)=>b.gp/b.j-a.gp/a.j)[0],def=teams.slice().sort((a,b)=>a.gc/a.j-b.gc/b.j)[0];
  const unb=teams.slice().sort((a,b)=>(b.pts/(b.j*3))-(a.pts/(a.j*3)))[0];
  const coaches=[];for(const d of DIVS){const byLv=G.div[d].slice().sort((a,b)=>teamStrength(G.clubs[b])-teamStrength(G.clubs[a]));
    for(const t of teams.filter(x=>x.d===d)){const exp=byLv.indexOf(t.id)+1;const gain=exp-t.pos+(t.pos===1?3:0)+(DIVS.indexOf(d)===0?1.5:0);coaches.push({id:t.id,d,coach:coachOf(t.id),pos:t.pos,exp,gain})}}
  coaches.sort((a,b)=>b.gain-a.gain);
  const runner={};for(const d of DIVS)runner[d]=sortedTable(d)[1].id;
  let cupF=null;const fr=(G.cup.results||[])[CUP_NAMES.length-1];if(fr&&fr[0]){const t=fr[0];cupF={h:t.h,a:t.a,gh:t.gh,ga:t.ga,pens:t.pens||null,w:t.w}}
  return {season:G.season,champ,runner,up,down,cup:G.cup.champion,cupF,mvp:card(mvp),scorers,assist:card(assist),gk:card(gk),young:card(young),xi,
    att:att&&{id:att.id,gp:att.gp,j:att.j,d:att.d},def:def&&{id:def.id,gc:def.gc,j:def.j,d:def.d},best:unb&&{id:unb.id,pts:unb.pts,j:unb.j,d:unb.d,v:unb.v},coaches:coaches.slice(0,3)}}

/* histórico: Início é a base; qualquer outra tela fica uma camada acima, então o voltar do celular sempre leva ao Início */
const HN={skip:0,on:0};
function hnInit(){if(HN.on)return;HN.on=1;try{history.replaceState({v:'home',base:1},'')}catch(e){}
  addEventListener('popstate',e=>{if(HN.skip){HN.skip--;return}const st=e.state||{};
    if(!$('#modal').hidden){closeModal(1);if(st.base&&view!=='home')go('home',1);else if(st.v&&st.v!==view)go(st.v,1);return}
    if($('.app').hidden)return;go(st.v&&!st.base?st.v:'home',1)})}
function hnGo(v){if(!HN.on)return;const st=history.state||{};const d=st.d||0;try{
  if(v==='home'){if(!st.base)history.replaceState({v:'home',base:1},'')}/* nunca volta páginas: assim o Início jamais sai do jogo */
  else if(st.v==='player'&&v===st.from&&d>0)history.replaceState({v,d:Math.max(1,d-1)},'')
  else if(v==='player'){if(st.v==='player')history.replaceState({...st},'');else history.pushState({v,from:st.base?'home':st.v,d:d+1},'')}
  else if(st.base)history.pushState({v,d:1},'');else history.replaceState({v,d},'')}catch(e){}}
function go(v,fromPop){if(!fromPop)hnGo(v);document.body.classList.remove('side-open');document.body.dataset.view=v;if(v!=='auction'&&typeof auStage==='function')auStage(false);if(MV.live&&v!=='match'&&MV.m&&MV.m.phase!=='ft'){MV.pause()}view=v;$$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));renderTop();const f={home:vHome,squad:vSquad,tactics:()=>TV.render($('#v-tactics')),training:vTraining,youth:vYouth,club:vClub,market:vMarket,online:()=>ON.render(),auction:vAuction,league:vLeague,match:MV.render,player:vPlayer}[v];f&&f();$('main').scrollTop=0;if(A.scene)A.scene(v==='tactics'?'tac':'menu');if(v==='match'&&A.ready&&A.preload)A.preload();
  if(v!=='match'&&A.ready){A.crowd(false);A.fadeMusic(1)}}

function threadHtml(m){if(!m.thread||!m.thread.length)return '';const g=G();const me=esc(g.manager||'Você');

function cupStatusHtml(){const g=G(),cup=g.cup,u=g.user;if(!cup)return '';const q=cup.qual&&cup.qual[u];
  let st;if(cup.champion===u)st='🏆 Campeão da Taça!';else if(cup.out&&cup.out[u])st=`Eliminado nas ${cup.out[u].replace(/ de final/,'')}`;else if(cup.alive.includes(u))st=`Vivo · próxima fase: ${C.CUP_NAMES[cup.round]||'—'}`;else st='Não está na Taça';

/* ---------- plantel: arrastar um jogador sobre outro troca os dois ---------- */
function locOf(id){const t=G().tactic;let i=t.lineup.indexOf(id);if(i>=0)return {k:'slot',i};i=t.subs.indexOf(id);if(i>=0)return {k:'sub',i};return {k:'out'}}
function swapPlayers(a,b){const t=G().tactic;if(a===b)return false;const A=locOf(a),B=locOf(b);const pa=P(a),pb=P(b);
  if(A.k==='out'&&B.k==='out'){toast('Os dois estão fora da lista.');return false}
  if((B.k!=='out'&&pa.inj)||(A.k!=='out'&&pb.inj)){toast('⚠️ Jogador lesionado não pode ser relacionado.');return false}
  const put=(loc,id)=>{if(loc.k==='slot')t.lineup[loc.i]=id;else if(loc.k==='sub')t.subs[loc.i]=id};
  if(A.k==='out'){put(B,a)}else if(B.k==='out'){put(A,b)}else{put(A,b);put(B,a)}
  C.save();const lbl=(l,p)=>{if(l.k==='slot'){const r=t.slots[l.i].role;return `titular de ${r}${C.GROUP[p.p]===C.GROUP[r]?'':' ⚠️ fora de posição'}`}return l.k==='sub'?'reserva':'fora da lista'};
  toast(`🔁 ${esc(surname(pa.n))} (${pa.p}) agora é ${lbl(B,pa)} · ${esc(surname(pb.n))} (${pb.p}) agora é ${lbl(A,pb)}`);return true}
function bindSquadDrag(){const root=$('#v-squad');if(!root)return;
  root.querySelectorAll('[data-drag]').forEach(h=>{h.onclick=e=>e.stopPropagation();h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();const id=+h.dataset.drag;const row=h.closest('tr');
    const gh=document.createElement('div');gh.className='drag-ghost';gh.innerHTML=row.querySelector('td:nth-child(2) b').outerHTML;document.body.appendChild(gh);row.classList.add('dragging');
    let over=null;const mv=ev=>{gh.style.left=ev.clientX+'px';gh.style.top=ev.clientY+'px';const el=document.elementFromPoint(ev.clientX,ev.clientY);const tr=el&&el.closest('[data-sqrow]');
      if(over&&over!==tr)over.classList.remove('dropover');over=tr&&tr!==row?tr:null;if(over)over.classList.add('dropover');
      const m=$('main');const r=m.getBoundingClientRect();if(ev.clientY<r.top+60)m.scrollTop-=12;else if(ev.clientY>r.bottom-90)m.scrollTop+=12};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);gh.remove();row.classList.remove('dragging');
      if(over){over.classList.remove('dropover');if(swapPlayers(id,+over.dataset.sqrow)){A.click&&A.click();keepScroll(vSquad);renderTop()}}};
    mv(e);addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}})}
function vSquad(){

  S.navList=list.map(p=>p.id);

   <div class="seg" style="width:340px">${[['all','Todos'],['G','Gol'],['D','Defesa'],['M','Meio'],['A','Ataque']].map(([x,l])=>`<button data-sf="${x}" class="${f===x?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="frame" style="overflow:auto"><table class="sq-t"><thead><tr>${th('pos','Pos')}${th('n','Nome')}${th('a','Idade')}${th('o','Geral')}${th('pot','Potencial')}${th('fm','Forma')}${th('fi','Condição')}${th('mo','Humor')}<th>Relação</th>${th('g','Gols')}${th('v','Valor')}${th('w','Salário')}<th>Status</th></tr></thead><tbody>
  ${(()=>{const grp=id=>t.lineup.includes(id)?0:t.subs.includes(id)?1:2;const G3=[[],[],[]];list.forEach(p=>G3[grp(p.id)].push(p));

    return G3.map((arr,gi)=>arr.length?`<tr class="sq-grp ${lab[gi][0]}"><td colspan="13"><b>${lab[gi][1]}</b> <span>${lab[gi][2]}</span></td></tr>`+arr.map(p=>`<tr class="click sq-${lab[gi][0]}" data-player="${p.id}" data-sqrow="${p.id}"><td><span class="dh" data-drag="${p.id}" title="Arraste para trocar">⠿</span>${posTag(p.p)}</td><td><b>${esc(p.n)}</b>${p.inj?` <span class="chip bad">lesão ${p.inj}</span>`:''}${p.pr?' <span class="chip warn">promessa</span>':''}${p.wantOut?' <span class="chip bad">quer sair</span>':''}${(G().toSell||[]).includes(p.id)?' <span class="chip warn">à venda</span>':''}</td><td>${p.a}</td><td>${ovrTag(C.ovr(p))}</td><td>${potStars(p)}</td><td>${rtTag(C.formAvg(p))}</td><td>${fitBar(p.fi)}</td><td>${C.moodText(p)}</td><td class="muted">${C.relText(p.re)}</td><td>${p.st.g}</td><td class="num">${money(p.v)}</td><td class="num dim">${money(p.w)}</td><td>${st(p.id)}</td></tr>`).join(''):'').join('')})()}</tbody></table></div>`;

      return `<div><div class="h" style="font-size:13px">${n}</div>${ties.length?ties.map(t=>`<div class="tie"><div class="${t.w?(t.w===t.h?'w':'l'):''}"><span>${esc(clubOf(t.h).short)}</span><b>${t.gh??''}${t.pens?` (${t.pens[0]})`:''}</b></div><div class="${t.w?(t.w===t.a?'w':'l'):''}"><span>${esc(clubOf(t.a).short)}</span><b>${t.ga??''}${t.pens?` (${t.pens[1]})`:''}</b></div></div>`).join(''):'<div class="dim">a definir</div>'}</div>`}).join('');
    const qual=cup.qual||{};const parts=Object.keys(qual).length?Object.keys(qual):cup.alive;

      <div class="frame"><div class="h">Artilharia</div><table><tbody>${top.map((p,i)=>`<tr class="click" data-player="${p.id}"><td class="dim">${i+1}</td><td><b>${esc(p.n)}</b><div class="dim" style="font-size:12px">${esc(clubOf(p.c).short)}</div></td><td>${posTag(p.p)}</td><td class="num" style="font-size:20px"><b>${p.st.g}</b></td></tr>`).join('')||'<tr><td class="muted">Sem gols ainda.</td></tr>'}</tbody></table></div></div></div>`}
  const past=(g.seasonLog||[]).filter(x=>x.recap).slice().reverse();if(past.length&&d!=='cup')body+=`<div class="frame rc-past"><div class="h">Resumões das temporadas</div><div class="row">${past.map(x=>`<button class="btn ghost sm" data-recap="${x.season}">${x.season}</button>`).join('')}</div></div>`;
  $('#v-league').innerHTML=`<div class="page-head"><div><div class="eyebrow">Competições ${g.season}</div><h1 class="title">Liga & Taça</h1></div><div class="sp"></div><div class="seg lg-seg" style="width:520px">${tabs.map(([k,l])=>`<button data-lg="${k}" class="${d===k?'on':''}">${innerWidth<560?l.replace('Série ','Série\u00a0').replace('Taça Nacional','Taça'):l}</button>`).join('')}</div></div>${body}`;
}

var CAR=(function(){let dbp=null,tm=null;
  const db=()=>dbp||(dbp=new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error('sem IndexedDB'));return}const r=indexedDB.open('futbol',1);r.onupgradeneeded=()=>r.result.createObjectStore('careers',{keyPath:'cid'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=async(mode,f)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('careers',mode);const r=f(t.objectStore('careers'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
  const meta=g=>{const c=g.clubs[g.user]||{};return {club:c.name||g.user,short:c.short||g.user,kit:c.kit,div:c.div,season:g.season,seasons:(g.seasonLog||[]).length,titles:(()=>{try{return C.trophies().length}catch(e){return 0}})(),manager:g.manager,upd:Date.now()}};
  const put=g=>run('readwrite',s=>s.put({cid:g.cid,meta:meta(g),data:JSON.stringify(g)})).catch(e=>console.warn('car',e));
  return {put,later(){clearTimeout(tm);tm=setTimeout(()=>{if(C.G&&C.G.cid&&!C.G._tacBak)put(C.G)},1500)},
    list:()=>run('readonly',s=>s.getAll()).then(a=>(a||[]).map(x=>({cid:x.cid,meta:x.meta})).sort((a,b)=>b.meta.upd-a.meta.upd)).catch(()=>[]),
    get:cid=>run('readonly',s=>s.get(cid)),del:cid=>run('readwrite',s=>s.delete(cid))}})();

function kick(k,gk,side,pow,dive){
  const pick=()=>['L','M','R'][Math.random()<.42?0:Math.random()<.72?2:1];if(side==='?')side=pick();
  const fin=k.a.fin,g=gk?gk.a.gol:10;
  const miss=side==='M'?.03:pow==='for'?.1+(12-fin)*.006:.05+(12-fin)*.008;
  if(Math.random()<Math.max(.01,miss))return {r:'fora',side};
  if(dive==='ler')dive=Math.random()<.35+(g-12)*.02?side:['L','M','R'].filter(x=>x!==side)[Math.random()<.5?0:1];
  if(dive===side){const sv=(side==='M'?.65:pow==='for'?.32:.52)+(g-12)*.015-(fin-12)*.01;if(Math.random()<sv)return {r:'defesa',side,dive}}
  else if(Math.random()<.03+(g-12)*.004)return {r:'defesa',side,dive};
  return {r:'gol',side,dive};
}

     <button class="btn sm" id="on-send" style="margin-top:8px">${mine&&mine.team?'Atualizar meu time':'Enviar meu time'}</button><p class="dim" style="font-size:12px;margin:6px 0 0">Envia a escalação, a tática e os jogadores da sua carreira atual (${esc(C.userClub().name)}).</p></div>
    ${lg.status==='open'?`<div class="frame"><div class="h">Começar</div>${owner?`<p class="muted" style="margin:0 0 8px">Precisa de pelo menos 2 técnicos com time enviado.</p><div class="row"><button class="btn" data-onstart="2">Começar (ida e volta)</button><button class="btn ghost" data-onstart="1">Só ida</button></div>`:'<p class="muted" style="margin:0">Aguardando o criador começar a liga.</p>'}<button class="btn ghost xs" id="on-leave" style="margin-top:8px">Sair da liga</button></div>`:''}</div></div>`}
function bind(){const on=(s,f)=>{const e=$(s);if(e)e.onclick=U.err(f)};
  document.querySelectorAll('[data-ontab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.ontab;render()});
  document.querySelectorAll('[data-onl]').forEach(b=>b.onclick=U.err(async()=>{await loadLeague(+b.dataset.onl);render()}));
  on('#on-create',async()=>{const j=await api('mpl_create',{name:$('#on-lname').value,team:snapTeam()});U.toast(`Liga criada! Código ${j.code}`);await loadLeague(j.id);render()});
  on('#on-join',async()=>{const j=await api('mpl_join',{code:$('#on-lcode').value,team:snapTeam()});U.toast('Você entrou na liga.');await loadLeague(j.id);render()});
  on('#on-back',()=>{S.lid=null;S.league=null;render()});
  on('#on-send',async()=>{await api('mpl_team',{id:S.lid,team:snapTeam()});U.toast('Time enviado.');await loadLeague(S.lid);render()});
  on('#on-leave',async()=>{if(!confirm('Sair desta liga?'))return;await api('mpl_leave',{id:S.lid});S.lid=null;S.league=null;render()});
  document.querySelectorAll('[data-onstart]').forEach(b=>b.onclick=U.err(async()=>{await api('mpl_start',{id:S.lid,turns:+b.dataset.onstart});U.toast('A liga começou!');await loadLeague(S.lid);render()}));
  document.querySelectorAll('[data-onplay]').forEach(b=>b.onclick=U.err(()=>playFixture(+b.dataset.onplay,true)));
  document.querySelectorAll('[data-onquick]').forEach(b=>b.onclick=U.err(()=>playFixture(+b.dataset.onquick,false)));
  on('#on-simall',async()=>{const L=S.league;const rnd=L.league.round;for(let i=0;i<L.league.fixtures[rnd].length;i++)if(!resOf(L,rnd,i))await playFixtureQuick(i);await loadLeague(S.lid);U.toast('Rodada simulada.');render()});
  on('#on-lvcreate',async()=>{const j=await api('live_create',{team:snapTeam()});S.live={id:j.id};await livePoll();render()});
  on('#on-lvjoin',async()=>{const j=await api('live_join',{code:$('#on-lvcode').value,team:snapTeam()});S.live={id:j.id};await livePoll();render()});
  on('#on-ready',async()=>{await api('live_ready',{id:S.live.id});await livePoll();render()});
  on('#on-lvcancel',()=>{S.live=null;render()});}
return {render,cleanup,snapTeam,get S(){return S}};
})();
</script>
<script>U.boot()</script>
</body></html>
